services:
  smart-notes:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      NODE_ENV: production
      SESSION_SECRET: change-this-in-production
      CLIENT_ORIGIN: http://localhost:3000
      DB_PATH: /app/data/notes.db
    volumes:
      - ./data:/app/data
